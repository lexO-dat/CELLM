services:
  ollama:
    build: ./llm/ollama
    ports:
      - "11434:11434"
    networks:
      llm_net:
        ipv4_address: 172.28.0.2
  ollama-gateway:
    build: ./llm/
    ports:
      - "8001:8001"
    networks:
      llm_net:
        ipv4_address: 172.28.0.3

  cello:
    image: lexodat2111/cello-api
    ports:
      - "8000:8000"
    networks:
      llm_net:
        ipv4_address: 172.28.0.4
  cli: 
    build: ./
    networks:
      llm_net:
        ipv4_address: 172.28.0.5

networks:
  llm_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

# sudo docker compose up -d ollama ollama-gateway cello -> run only ollama, ollama-gateway, cello on background
# sudo docker compose run --rm -it cli -> run cli on foreground
# colima start --mount /Volumes/KINGSTON:/mnt/kingston mount a disk for docker
# colima start --mount /System/Volumes/Data --memory 32 --cpu 10
